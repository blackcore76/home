<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="flip-clock-manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600&display=swap" rel="stylesheet">
<title>Dual Market Clock</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:#0a0a0a;color:#f0f0f0;
  font-family:'Noto Sans KR',sans-serif;font-weight:600;
  display:flex;flex-direction:column;align-items:center;
  /* 시세 띠 아래 남은 높이를 위·가운데·아래 같은 간격으로 나눈다 */
  justify-content:space-around;justify-content:space-evenly;
  padding-top:30px;
  user-select:none;-webkit-user-select:none}

.ticker-wrap{position:fixed;top:0;left:0;right:0;height:30px;z-index:95;
  background:rgba(10,10,10,.97);border-bottom:1px solid #1a1a1a;
  overflow:hidden;display:flex;align-items:center}
.ticker-track{display:flex;align-items:center;white-space:nowrap;
  animation:ticker-scroll 55s linear infinite;will-change:transform}
.ticker-track:hover{animation-play-state:paused}
@keyframes ticker-scroll{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
.ticker-item{display:inline-flex;align-items:center;gap:6px;padding:0 20px;
  font-family:'Noto Sans KR',sans-serif;font-size:13px;
  border-right:1px solid rgba(255,255,255,.06)}
.tk-name{color:#fff;font-weight:500;letter-spacing:.04em}
.tk-price{color:#fff;font-weight:600}
.tk-chg{font-size:11px;font-weight:500}
.tk-chg.c-up{color:#ff3b5c}
.tk-chg.c-dn{color:#448aff}
.tk-chg.c-vup{color:#448aff}
.tk-chg.c-vdn{color:#ff3b5c}
.tk-chg.c-nt{color:#fff}

.wrap{display:flex;width:100%;max-width:1080px;gap:0;padding:0 8px}

.clock{flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center}
.clock:first-child{border-right:1px solid #1a1a1a}

.header{display:flex;align-items:baseline;gap:12px;margin-bottom:10px}
.region{font-size:24px;color:#fff;letter-spacing:.15em}
.date{font-size:24px;color:#fff;letter-spacing:.06em}

.time-row{display:flex;align-items:center;gap:16px}
.time{font-size:84px;font-weight:600;color:#fff;letter-spacing:.02em;
  line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap}
.time .sec{font-size:36px;color:#fff;margin-left:4px}

.badge-col{display:flex;flex-direction:column;gap:3px}
.badge{padding:3px 10px;border-radius:10px;font-size:11px;font-weight:600;
  letter-spacing:.02em;white-space:nowrap;
  border:1px solid transparent}
.badge.off{background:#141414;color:#3a3a3a;border-color:#1a1a1a}
.badge.on{color:#fff}

.badge.on[data-c="pre"]{background:#1a3a2a;border-color:#2d7a4f;color:#4ade80}
.badge.on[data-c="regular"]{background:#1a2a3a;border-color:#2563eb;color:#60a5fa}
.badge.on[data-c="post"]{background:#3a2a1a;border-color:#d97706;color:#fbbf24}
.badge.on[data-c="single"]{background:#2a1a2a;border-color:#9333ea;color:#c084fc}
.badge.on[data-c="preUS"]{background:#1a3a2a;border-color:#2d7a4f;color:#4ade80}
.badge.on[data-c="regularUS"]{background:#1a2a3a;border-color:#2563eb;color:#60a5fa}
.badge.on[data-c="afterUS"]{background:#3a2a1a;border-color:#d97706;color:#fbbf24}
.badge.on[data-c="dayUS"]{background:#2a1a2a;border-color:#9333ea;color:#c084fc}

/* ── 전체화면 버튼 ── */
#fsBtn{position:fixed;right:12px;bottom:12px;z-index:99;
  width:44px;height:44px;line-height:44px;text-align:center;
  border-radius:22px;background:rgba(255,255,255,.08);
  color:#fff;font-size:20px;cursor:pointer;
  -webkit-transition:opacity .4s;transition:opacity .4s;opacity:.35}
#fsBtn:active{background:rgba(255,255,255,.18)}
#fsBtn.hide{opacity:0;pointer-events:none}

@media(max-width:760px){
  body{padding-top:24px}
  .ticker-wrap{height:24px}
  .ticker-item{font-size:11px;padding:0 12px;gap:4px}
  .tk-chg{font-size:9px}
  .wrap{height:auto;padding:0 4px}
  .header{gap:6px;margin-bottom:4px}
  .region{font-size:14px!important}
  .date{font-size:14px!important}
  .time-row{gap:8px}
  .time{font-size:48px}
  .time .sec{font-size:20px;margin-left:2px}
  .badge-col{gap:2px}
  .badge{padding:2px 6px;font-size:9px;border-radius:6px}
  #fsBtn{width:38px;height:38px;line-height:38px;font-size:17px;right:8px;bottom:8px}
}
@media(max-width:480px){
  .region{font-size:11px!important}
  .date{font-size:11px!important}
  .time{font-size:36px}
  .time .sec{font-size:16px}
  .badge{padding:1px 5px;font-size:8px}
}

/* ── Claude 사용량 (맥미니 상태줄 → Funnel /claude-usage) ── */
.usage{display:flex;width:100%;max-width:1080px;padding:0 24px}
.u-cell{flex:1;padding:14px 20px;border:1px solid #1a1a1a;border-radius:14px;background:#0f0f0f;margin:0 6px}
.u-lab{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:#fff;font-weight:500;letter-spacing:.02em}
.u-lab b{font-weight:500;color:#fff;font-size:12px}
.u-val{font-size:30px;color:#fff;line-height:1.2;margin-top:4px;font-variant-numeric:tabular-nums}
.u-val small{font-size:14px;color:#fff;font-weight:500;margin-left:6px}
.u-bar{position:relative;height:4px;background:#1c1c1c;border-radius:2px;margin-top:10px}
.u-bar i{display:block;height:100%;width:0;background:#d8d8d8;border-radius:2px;-webkit-transition:width .6s;transition:width .6s}
/* 시간 흐름 기준선: 남은 막대 끝이 이 선보다 오른쪽이면 지금 속도로 여유 있음 */
.u-pace{position:absolute;top:-3px;bottom:-3px;width:2px;margin-left:-1px;background:#fff;opacity:.55;border-radius:1px}
.u-dot{display:inline-block;width:7px;height:7px;border-radius:4px;background:#4ade80;margin-right:6px;vertical-align:1px}
.u-dot.stale{background:#fbbf24} .u-dot.err{background:#ff3b5c}
.u-cell.warn .u-bar i{background:#fbbf24} .u-cell.warn .u-val{color:#fbbf24}
.u-cell.low .u-bar i{background:#ff3b5c} .u-cell.low .u-val{color:#ff3b5c}
.u-sub{font-size:12px;color:#fff;margin-top:8px;font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 15분 넘게 갱신이 없으면: 세션·주간 값은 흐리게 + "HH:MM 기준", 갱신 문구는 호박색 */
.usage.stale .u-lim .u-val,.usage.stale .u-lim .u-bar{opacity:.4}
.usage.stale #uRstS{color:#fbbf24}
@media(max-width:760px){
  .usage{padding:0 4px}
  .u-cell{padding:8px 10px;margin:0 3px;border-radius:10px}
  .u-lab{font-size:10px} .u-lab b{font-size:9px}
  .u-val{font-size:18px} .u-val small{font-size:10px;margin-left:3px}
  .u-bar{margin-top:6px;height:3px}
  .u-sub{font-size:9px;margin-top:4px}
}
/* 세로 폰: 칸이 넘치지 않게 두 줄로 */
@media(max-width:600px){
  .usage{flex-wrap:wrap}
  .u-cell{flex:1 1 40%;margin:3px}
}

/* 창 높이가 낮을 때: 시계·칸을 조금 줄여 위아래 여백을 지킨다 */
@media(min-width:761px) and (max-height:560px){
  .header{margin-bottom:6px} .region,.date{font-size:20px}
  .time{font-size:68px} .time .sec{font-size:30px}
  .u-cell{padding:10px 16px} .u-val{font-size:24px} .u-bar{margin-top:8px} .u-sub{margin-top:6px}
}
@media(min-width:761px) and (max-height:440px){
  .region,.date{font-size:17px}
  .time{font-size:56px} .time .sec{font-size:24px}
  .badge{padding:2px 8px;font-size:10px}
  .u-cell{padding:8px 14px} .u-lab{font-size:12px} .u-val{font-size:20px} .u-sub{font-size:11px}
}
</style>
</head>
<body>

<div class="ticker-wrap" id="tickerWrap">
  <div class="ticker-track" id="tickerTrack">
    <span class="tk-name" style="padding:0 16px;opacity:.4">로딩 중…</span>
  </div>
</div>

<div class="wrap">
  <div class="clock">
    <div class="header">
      <span class="region">KOREA · KRX</span>
      <span class="date" id="krDate"></span>
    </div>
    <div class="time-row">
      <div class="time" id="krTime">--:--<span class="sec">--</span></div>
      <div class="badge-col" id="krBadges">
        <span class="badge off" data-c="pre" data-s="30600" data-e="32400">장전 시간외</span>
        <span class="badge off" data-c="regular" data-s="32400" data-e="55800">정규장</span>
        <span class="badge off" data-c="post" data-s="56400" data-e="57600">장후 시간외</span>
        <span class="badge off" data-c="single" data-s="57600" data-e="64800">시간외 단일가</span>
      </div>
    </div>
  </div>

  <div class="clock">
    <div class="header">
      <span class="region">USA · NYSE</span>
      <span class="date" id="usDate"></span>
    </div>
    <div class="time-row">
      <div class="time" id="usTime">--:--<span class="sec">--</span></div>
      <div class="badge-col" id="usBadges">
        <span class="badge off" data-c="dayUS" data-s="72000" data-e="14400" data-wrap="1">데이마켓</span>
        <span class="badge off" data-c="preUS" data-s="14400" data-e="34200">프리마켓</span>
        <span class="badge off" data-c="regularUS" data-s="34200" data-e="57600">정규장</span>
        <span class="badge off" data-c="afterUS" data-s="57600" data-e="72000">애프터마켓</span>
      </div>
    </div>
  </div>
</div>

<!-- 한도 칸(5시간·주간·모델별)은 데이터에 따라 스크립트가 앞에 채워 넣는다. 맨 끝은 세션 초기화 카운트다운 -->
<div class="usage stale" id="usage">
  <div class="u-cell" id="uRst">
    <div class="u-lab"><span><span class="u-dot err" id="uDot"></span>세션 초기화까지</span> <b id="uPlan">Claude</b></div>
    <div class="u-val" id="uRstV">--:--</div>
    <div class="u-bar"><i id="uRstB"></i></div>
    <div class="u-sub" id="uRstS">기다리는 중</div>
  </div>
</div>

<div id="fsBtn" title="전체화면">⛶</div>

<script>
var KR_TZ = 'Asia/Seoul';
var US_TZ = 'America/New_York';

var krTimeEl = document.getElementById('krTime');
var usTimeEl = document.getElementById('usTime');
var krDateEl = document.getElementById('krDate');
var usDateEl = document.getElementById('usDate');
var krBadges = document.querySelectorAll('#krBadges .badge');
var usBadges = document.querySelectorAll('#usBadges .badge');

function getTimeParts(tz) {
  var d = new Date();
  var f = new Intl.DateTimeFormat('en-GB', {timeZone:tz, hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false});
  var p = f.formatToParts(d);
  var obj = {};
  for (var i = 0; i < p.length; i++) {
    if (p[i].type !== 'literal') obj[p[i].type] = p[i].value;
  }
  return obj;
}

function formatDate(tz) {
  return new Date().toLocaleDateString('ko-KR', {
    timeZone:tz, month:'long', day:'numeric', weekday:'short'
  });
}

function isWeekend(tz) {
  var dow = parseInt(new Intl.DateTimeFormat('en-US', {timeZone:tz, weekday:'narrow'}).formatToParts(new Date())[0].value, 10);
  var dayStr = new Intl.DateTimeFormat('en-US', {timeZone:tz, weekday:'short'}).format(new Date());
  return dayStr === 'Sat' || dayStr === 'Sun';
}

function updateBadges(badges, sod, weekend) {
  for (var i = 0; i < badges.length; i++) {
    var b = badges[i];
    var s = parseInt(b.getAttribute('data-s'), 10);
    var e = parseInt(b.getAttribute('data-e'), 10);
    var wrap = b.getAttribute('data-wrap') === '1';
    var isOn = weekend ? false : (wrap ? (sod >= s || sod < e) : (sod >= s && sod < e));
    if (isOn && b.className.indexOf('off') !== -1) {
      b.className = 'badge on';
    } else if (!isOn && b.className.indexOf('on') !== -1) {
      b.className = 'badge off';
    }
  }
}

var lastKrDate = '', lastUsDate = '';

function tick() {
  var kr = getTimeParts(KR_TZ);
  var us = getTimeParts(US_TZ);

  krTimeEl.innerHTML = kr.hour + ':' + kr.minute + '<span class="sec">' + kr.second + '</span>';
  usTimeEl.innerHTML = us.hour + ':' + us.minute + '<span class="sec">' + us.second + '</span>';

  var krSod = parseInt(kr.hour,10)*3600 + parseInt(kr.minute,10)*60 + parseInt(kr.second,10);
  var usSod = parseInt(us.hour,10)*3600 + parseInt(us.minute,10)*60 + parseInt(us.second,10);

  updateBadges(krBadges, krSod, isWeekend(KR_TZ));
  updateBadges(usBadges, usSod, isWeekend(US_TZ));

  if (kr.second === '00' || lastKrDate === '') {
    var kd = formatDate(KR_TZ);
    if (kd !== lastKrDate) { krDateEl.textContent = kd; lastKrDate = kd; }
  }
  if (us.second === '00' || lastUsDate === '') {
    var ud = formatDate(US_TZ);
    if (ud !== lastUsDate) { usDateEl.textContent = ud; lastUsDate = ud; }
  }
}

tick();
setInterval(tick, 1000);

// ── 화면 꺼짐 방지 (지원하는 기기에서만) ──
if (navigator.wakeLock && navigator.wakeLock.request) {
  (function(){
    var wl = null;
    function req(){
      try {
        navigator.wakeLock.request('screen').then(function(s){ wl = s; }, function(){});
      } catch(e) {}
    }
    req();
    document.addEventListener('visibilitychange', function(){
      if (document.visibilityState === 'visible') req();
    });
  })();
}

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('flip-clock-sw.js')['catch'](function(){});
}

// ── 티커 테이프 (구형 WebView 호환판) ──
(function(){
    var DEBUG = location.search.indexOf('debug') !== -1;
    var lastErr = '';

    var TICKER_INSTR = [
        { name:'NASDAQ',  sym:'^IXIC', isVix:false, fmt:'int', pre:'' },
        { name:'S&P500',  sym:'^GSPC', isVix:false, fmt:'int', pre:'' },
        { name:'DOW',     sym:'^DJI',  isVix:false, fmt:'int', pre:'' },
        { name:'VIX',     sym:'^VIX',  isVix:true,  fmt:'d2',  pre:'' },
        { name:'KOSPI',   sym:'^KS11', isVix:false, fmt:'d2',  pre:'' },
        { name:'KOSDAQ',  sym:'^KQ11', isVix:false, fmt:'d2',  pre:'' },
        { name:'금 현물', sym:'GC=F',  isVix:false, fmt:'d2',  pre:'$' },
        { name:'환율',    sym:'KRW=X', isVix:false, fmt:'d2',  pre:'₩' },
        { name:'WTI원유', sym:'CL=F',  isVix:true,  fmt:'d2',  pre:'$' }
    ];

    var PROXIES = [
        function(u){ return 'https://lotto-proxy.blackcore-ff6.workers.dev/?url=' + encodeURIComponent(u); },
        function(u){ return 'https://corsproxy.io/?url=' + encodeURIComponent(u); },
        function(u){ return 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u); },
        function(u){ return 'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(u); }
    ];
    var winPx = null;

    function tkFmt(val, f, pre) {
        if (val === null || val === undefined) return '—';
        var s = (f === 'int')
            ? Math.round(val).toLocaleString('en-US')
            : val.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
        return pre + s;
    }

    // fetch / AbortSignal.timeout 유무와 무관하게 동작하는 GET
    function httpGet(url, ms) {
        return new Promise(function(resolve, reject){
            var done = false, ctrl = null, xhr = null;
            var timer = setTimeout(function(){
                if (done) return;
                done = true;
                try { if (ctrl) ctrl.abort(); } catch(e){}
                try { if (xhr) xhr.abort(); } catch(e){}
                reject(new Error('timeout'));
            }, ms);

            function ok(v){ if (done) return; done = true; clearTimeout(timer); resolve(v); }
            function ng(e){ if (done) return; done = true; clearTimeout(timer); reject(e); }

            if (typeof fetch === 'function') {
                var opt = {};
                if (typeof AbortController === 'function') {
                    ctrl = new AbortController();
                    opt.signal = ctrl.signal;
                }
                fetch(url, opt).then(function(res){
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    return res.text();
                }).then(ok, ng);
            } else {
                xhr = new XMLHttpRequest();
                xhr.open('GET', url, true);
                xhr.onreadystatechange = function(){
                    if (xhr.readyState !== 4) return;
                    if (xhr.status >= 200 && xhr.status < 300) ok(xhr.responseText);
                    else ng(new Error('HTTP ' + xhr.status));
                };
                xhr.onerror = function(){ ng(new Error('network')); };
                xhr.send();
            }
        });
    }

    function fetchOne(pfn, sym) {
        var url = 'https://query1.finance.yahoo.com/v8/finance/chart/'
                + encodeURIComponent(sym) + '?interval=1d&range=2d';
        return httpGet(pfn(url), 8000).then(function(txt){
            var d = JSON.parse(txt);
            var m = d && d.chart && d.chart.result && d.chart.result[0] && d.chart.result[0].meta;
            if (!m) throw new Error('no meta');
            return m;
        });
    }

    function fetchSym(sym) {
        var order = [];
        if (winPx !== null) order.push(PROXIES[winPx]);
        for (var i = 0; i < PROXIES.length; i++) {
            if (i !== winPx) order.push(PROXIES[i]);
        }
        var idx = 0;
        function next(){
            if (idx >= order.length) return Promise.resolve(null);
            var pfn = order[idx++];
            return fetchOne(pfn, sym).then(function(m){
                if (winPx === null) winPx = PROXIES.indexOf(pfn);
                return m;
            }, function(e){
                lastErr = (e && e.message) ? e.message : String(e);
                return next();
            });
        }
        return next();
    }

    function buildHTML(items) {
        var parts = [];
        for (var i = 0; i < items.length; i++) {
            var it = items[i];
            if (it.px === null || it.px === undefined) {
                parts.push('<span class="ticker-item"><span class="tk-name">' + it.name
                    + '</span><span class="tk-price tk-chg c-nt">—</span></span>');
                continue;
            }
            var chg = it.px - it.prv;
            var pct = it.prv ? (chg / it.prv) * 100 : 0;
            var up  = chg >= 0;
            var cls = it.isVix ? (up ? 'c-vup' : 'c-vdn') : (up ? 'c-up' : 'c-dn');
            parts.push('<span class="ticker-item"><span class="tk-name">' + it.name
                + '</span><span class="tk-price">' + tkFmt(it.px, it.fmt, it.pre)
                + '</span><span class="tk-chg ' + cls + '">' + (up ? '▲' : '▼') + ' '
                + (up ? '+' : '') + pct.toFixed(2) + '%</span></span>');
        }
        var html = parts.join('');
        return html + html;
    }

    function loadTicker() {
        var jobs = [];
        for (var i = 0; i < TICKER_INSTR.length; i++) {
            jobs.push(fetchSym(TICKER_INSTR[i].sym).then(null, function(){ return null; }));
        }
        return Promise.all(jobs).then(function(res){
            var items = [], anyOk = false;
            for (var k = 0; k < TICKER_INSTR.length; k++) {
                var inst = TICKER_INSTR[k], m = res[k], prv = null, px = null;
                if (m) {
                    px = (m.regularMarketPrice === undefined) ? null : m.regularMarketPrice;
                    prv = (m.chartPreviousClose === undefined || m.chartPreviousClose === null)
                        ? m.previousClose : m.chartPreviousClose;
                }
                if (px !== null && px !== undefined) anyOk = true;
                items.push({ name:inst.name, pre:inst.pre, fmt:inst.fmt,
                             isVix:inst.isVix, px:px, prv:prv });
            }
            var track = document.getElementById('tickerTrack');
            if (!track) return;
            if (!anyOk && DEBUG) {
                track.innerHTML = '<span class="ticker-item"><span class="tk-name">ERR</span>'
                    + '<span class="tk-price">' + lastErr + '</span></span>';
                return;
            }
            track.innerHTML = buildHTML(items);
        });
    }

    loadTicker();
    setInterval(loadTicker, 60000);
})();

// ── 전체화면 토글 ──
(function(){
    var btn = document.getElementById('fsBtn');
    var el  = document.documentElement;
    if (!btn) return;

    function isFs(){
        return document.fullscreenElement || document.webkitFullscreenElement || null;
    }
    function enter(){
        var fn = el.requestFullscreen || el.webkitRequestFullscreen;
        if (fn) { try { fn.call(el); } catch(e){} }
    }
    function exit(){
        var fn = document.exitFullscreen || document.webkitExitFullscreen;
        if (fn) { try { fn.call(document); } catch(e){} }
    }
    function sync(){ btn.innerHTML = isFs() ? '✕' : '⛶'; }

    btn.addEventListener('click', function(ev){
        ev.stopPropagation();
        if (isFs()) exit(); else enter();
        setTimeout(sync, 300);
    });
    document.addEventListener('fullscreenchange', sync);
    document.addEventListener('webkitfullscreenchange', sync);

    // 4초간 조작이 없으면 버튼을 숨기고, 화면을 건드리면 다시 표시
    var t = null;
    function poke(){
        btn.className = '';
        clearTimeout(t);
        t = setTimeout(function(){ btn.className = 'hide'; }, 4000);
    }
    document.addEventListener('touchstart', poke, true);
    document.addEventListener('mousemove', poke, true);
    poke();
})();

// ── Claude 사용량: 맥미니가 1분마다 앱 사용량 카드와 같은 값을 받아 둔다(퍼센트·초기화 시각만, 토큰 없음) ──
// 2026-11-25: 한도 칸을 데이터(limits)대로 만들고(5시간·주간·모델별), 시간 흐름 기준선·상태 점 추가. 구형 WebView 호환(ES5).
(function(){
  var URL = 'https://blackcore-macmini--m4.tail03a806.ts.net/claude-usage/v';
  var SPAN = { session: 5*3600, weekly: 7*86400 };
  var data = null, lastOk = 0, sig = '', cells = {};
  var WD=['일','월','화','수','목','금','토'];
  function $(id){ return document.getElementById(id); }
  function pad(n){ return (n<10?'0':'')+n; }
  function hm(sec){ var d=new Date(sec*1000); return pad(d.getHours())+':'+pad(d.getMinutes()); }
  function left(sec){ // 남은 시간 "2시간 31분" / "3일 4시간"
    if (sec <= 0) return '곧';
    var d=Math.floor(sec/86400), h=Math.floor(sec%86400/3600), m=Math.floor(sec%3600/60);
    return d ? d+'일 '+h+'시간' : (h ? h+'시간 '+m+'분' : m+'분');
  }
  function cap(t){ t=String(t||''); return t.charAt(0).toUpperCase()+t.slice(1); }

  // 데이터 → 칸 목록 [{key, name, tag, pct, reset, span, sev}]
  function rows(d){
    var out = [], i, l;
    if (d.limits && d.limits.length){
      for (i=0;i<d.limits.length;i++){
        l = d.limits[i];
        var nm, tg;
        if (l.kind === 'session'){ nm='현재 세션'; tg='5시간'; }
        else if (l.kind === 'weekly_all'){ nm='이번 주'; tg='전체 모델'; }
        else { nm = l.group==='weekly' ? '이번 주' : cap(l.group||''); tg = cap(String(l.scope||l.kind||'').replace(/^weekly_/,'')); }
        out.push({key:(l.kind||'')+':'+(l.scope||''), name:nm, tag:tg, pct:l.percent, reset:l.resets_at,
                  span:SPAN[l.group]||SPAN.weekly, sev:l.severity});
      }
      return out;
    }
    if (d.five_hour) out.push({key:'session:', name:'현재 세션', tag:'5시간', pct:d.five_hour.used, reset:d.five_hour.resets_at, span:SPAN.session});
    if (d.seven_day) out.push({key:'weekly_all:', name:'이번 주', tag:'전체 모델', pct:d.seven_day.used, reset:d.seven_day.resets_at, span:SPAN.weekly});
    return out;
  }

  // 칸 구성이 바뀔 때만 다시 만든다(매초 다시 그리면 막대 애니메이션이 끊김)
  function build(list){
    var keys=[], i; for (i=0;i<list.length;i++) keys.push(list[i].key);
    var s = keys.join('|'); if (s === sig) return; sig = s;
    var box=$('usage'), rst=$('uRst'), old=box.querySelectorAll('.u-lim');
    for (i=0;i<old.length;i++) box.removeChild(old[i]);
    cells = {};
    for (i=0;i<list.length;i++){
      var c=document.createElement('div');
      c.className='u-cell u-lim';
      c.innerHTML='<div class="u-lab"><span class="n"></span> <b class="t"></b></div>'+
        '<div class="u-val">--<small>남음</small></div>'+
        '<div class="u-bar"><i></i><span class="u-pace"></span></div><div class="u-sub">&nbsp;</div>';
      box.insertBefore(c, rst);
      cells[list[i].key] = c;
    }
  }

  function fillCell(r, now, stale){
    var c = cells[r.key]; if (!c) return;
    var q = function(sel){ return c.querySelector(sel); };
    var expired = r.reset && now >= r.reset;
    var used = expired ? 0 : (r.pct||0);                 // 초기화 시각이 지나면 새로 시작
    var rem = Math.max(0, Math.min(100, Math.round(100 - used)));
    q('.n').textContent = r.name; q('.t').textContent = r.tag;
    q('.u-val').innerHTML = rem + '%<small>' + (stale ? hm(stale)+' 기준' : '남음') + '</small>';
    q('.u-bar i').style.width = rem + '%';
    var pace = q('.u-pace');
    if (r.reset && !expired){
      // 남은 시간 비율 위치에 선. 남은 막대가 선보다 길면 여유.
      pace.style.display=''; pace.style.left = Math.max(0, Math.min(100, (r.reset-now)/r.span*100)) + '%';
    } else pace.style.display='none';
    var lvl = (r.sev==='critical' || rem < 10) ? ' low' : (r.sev==='warning' || rem < 25) ? ' warn' : '';
    c.className = 'u-cell u-lim' + lvl;
    var sEl = q('.u-sub');
    if (r.reset && !expired){
      var d=new Date(r.reset*1000);
      sEl.textContent = r.span > 86400
        ? (d.getMonth()+1)+'/'+d.getDate()+'('+WD[d.getDay()]+') '+hm(r.reset)+' 초기화 · '+left(r.reset-now)+' 후'
        : hm(r.reset)+' 초기화 · '+left(r.reset-now)+' 후';
    } else sEl.textContent = '새로 시작됨';
  }

  function render(){
    var now = Math.floor(Date.now()/1000);
    var dot=$('uDot'), rs=$('uRstS');
    if (!data){ if (lastOk===0 && now - t0 > 15){ dot.className='u-dot err'; rs.textContent='맥미니 연결 안 됨'; } return; }
    var age = now - (data.updated_at||0);
    var stale = age > 3*60 ? data.updated_at : 0;      // 맥미니가 1분마다 받으니 3분 넘으면 오래된 값
    var off = Date.now() - lastOk > 150000;             // 이 화면이 2분 반 넘게 못 읽음
    $('usage').className = 'usage' + (stale ? ' stale' : '');
    var list = rows(data); build(list);
    for (var i=0;i<list.length;i++) fillCell(list[i], now, stale);
    if (data.plan) $('uPlan').textContent = 'Claude ' + cap(data.plan);

    var ses = null; for (i=0;i<list.length;i++) if (list[i].key.indexOf('session')===0) ses=list[i];
    var rv=$('uRstV'), rb=$('uRstB');
    if (ses && ses.reset && now < ses.reset){
      var r=ses.reset-now;
      rv.textContent = Math.floor(r/3600)+':'+pad(Math.floor(r%3600/60))+':'+pad(r%60);
      rb.style.width = Math.max(0,Math.min(100,(1 - r/ses.span)*100)) + '%';
    } else { rv.textContent = '--:--'; rb.style.width='0'; }

    dot.className = 'u-dot' + (off ? ' err' : stale ? ' stale' : '');
    rs.textContent = off ? '맥미니 연결 안 됨'
      : data.status === 'token_expired' && stale ? 'Claude 쓰면 다시 갱신 · '+hm(data.updated_at)+' 값'
      : !data.updated_at ? '아직 기록 없음'
      : stale ? hm(data.updated_at)+' 값 · '+left(age)+' 지남'
      : age < 60 ? '방금 갱신' : Math.floor(age/60)+'분 전 갱신';
  }
  var t0 = Math.floor(Date.now()/1000);
  function load(){
    fetch(URL, {cache:'no-store'}).then(function(r){ return r.json(); })
      .then(function(j){ data=j; lastOk=Date.now(); render(); })
      ['catch'](function(){ render(); });
  }
  load(); setInterval(load, 30000); setInterval(render, 1000);
  document.addEventListener('visibilitychange', function(){ if (document.visibilityState === 'visible') load(); });
})();
</script>
</body>
